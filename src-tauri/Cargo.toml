[package]
name = "cli-launchpad"
version = "0.3.0"
description = "Lightweight desktop launcher for agentic CLI tools"
authors = ["SkyJourney"]
license = "MIT"
homepage = "https://github.com/SkyJourney/cli-launchpad"
repository = "https://github.com/SkyJourney/cli-launchpad"
edition = "2021"

[lib]
name = "cli_launchpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-std = "4.0.3"
log = "0.4"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
json5 = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
ureq = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
