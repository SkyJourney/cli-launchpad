name: Flaky probe

on:
  # 临时触发器（附录 A 方案二）：工作流文件不在默认分支时 gh workflow run 返回 404，
  # 仅在 m6-closure 上改动本文件时才触发；由目标 081 统一删除。
  push:
    branches:
      - m6-closure
    paths:
      - ".github/workflows/flaky-probe.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: Number of repeated test runs per platform
        required: false
        default: "20"
        type: string
      filter:
        description: Rust test name filter
        required: false
        default: "platform::file_cas"
        type: string
      cas_rounds:
        description: Rounds per cross-process CAS test run
        required: false
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  group: flaky-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      REPEAT: ${{ inputs.repeat || '20' }}
      FILTER: ${{ inputs.filter || 'platform::file_cas' }}
      CLI_LAUNCHPAD_CAS_ROUNDS: ${{ inputs.cas_rounds || '50' }}
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev xdg-utils

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Placeholder frontend dist
        run: |
          mkdir -p dist
          echo '<!doctype html><title>probe</title>' > dist/index.html

      - name: Build tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run

      - name: Repeat filtered tests
        run: |
          mkdir -p probe
          fails=0
          for i in $(seq 1 "$REPEAT"); do
            if ! cargo test --manifest-path src-tauri/Cargo.toml --locked -- "$FILTER" > "probe/run-$i.log" 2>&1; then
              fails=$((fails+1))
              cp "probe/run-$i.log" "probe/failed-$i.log"
            fi
          done
          deleted=0
          for f in probe/failed-*.log; do
            [ -e "$f" ] || continue
            if grep -q '(deleted)' "$f"; then
              deleted=$((deleted+1))
            fi
          done
          echo "failures=$fails/$REPEAT" | tee probe/summary.txt
          echo "deleted_alias_logs=$deleted" | tee -a probe/summary.txt
          test "$fails" -eq 0

      - name: Characterize upstream canonicalize race
        if: runner.os == 'Linux'
        run: |
          mkdir -p probe
          if cargo test --manifest-path src-tauri/Cargo.toml --locked -- --ignored --exact platform::file_cas::tests::cap_std_canonicalize_can_return_deleted_suffix_under_concurrent_replacement --nocapture > probe/characterization.log 2>&1; then
            echo "characterization=observed" | tee probe/characterization.txt
          else
            echo "characterization=not_observed" | tee probe/characterization.txt
          fi

      - name: Upload probe logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flaky-probe-${{ matrix.os }}
          path: probe/
          if-no-files-found: warn
          retention-days: 14
